<!-- public/submitted.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Submitted</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --ok:#16a34a; --btn:#111; --btnText:#fff; --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{ max-width:640px; margin:24px auto 40px; padding:0 14px; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 2px 14px rgba(0,0,0,.05);
      padding:18px;
      overflow:hidden;
      text-align:center;
      position:relative;
    }

    /* Confetti overlay (inside card) */
    #celebrateLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
      border-radius:var(--radius);
    }
    .card > :not(#celebrateLayer){
      position:relative;
      z-index:2;
    }
    #confettiLayer{
      position:absolute;
      inset:0;
      overflow:hidden;
    }
    .confetti-piece{
      position:absolute;
      top:-14px;
      width:10px;
      height:14px;
      border-radius:2px;
      opacity:0.95;
      transform: translate3d(0,0,0) rotate(0deg);
      animation: confettiFall var(--dur, 1400ms) linear var(--delay, 0ms) forwards;
      will-change: transform, opacity;
    }
    @keyframes confettiFall{
      0%   { transform: translate3d(0,0,0) rotate(0deg); opacity:1; }
      100% { transform: translate3d(var(--drift, 0px), var(--endY, 520px), 0) rotate(var(--rot, 360deg)); opacity:0.95; }
    }

    .tick{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:74px; height:74px;
      border-radius:999px;
      border:2px solid rgba(22,163,74,.25);
      background:rgba(22,163,74,.08);
      margin:6px auto 10px;
      font-size:42px;
      color:var(--ok);
      font-weight:900;
    }
    h1{ margin:0 0 6px; font-size:26px; font-weight:950; letter-spacing:-0.3px; }
    .sub{ color:var(--muted); font-weight:800; margin:0 0 14px; line-height:1.35; }
    .note{ margin:0 0 14px; font-weight:900; color:#111; }

    .meta{
      margin:0 auto 14px;
      display:inline-block;
      text-align:left;
      border:1px dashed var(--line);
      border-radius:14px;
      padding:12px 14px;
      background:#fff;
      font-weight:800;
      max-width:100%;
    }
    .meta div{ margin:4px 0; color:var(--muted); font-weight:900; }
    .meta span{ color:#111; font-weight:950; }

    .art{
      margin:10px auto 18px;
      max-width:420px;
    }
    .gifCard{
      width:100%;
      height:auto;
      display:block;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
    }

    .actions{ display:flex; gap:12px; margin-top:10px; }
    .actions a{
      flex:1;
      text-decoration:none;
      display:inline-block;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.6);
      background:var(--btn);
      color:var(--btnText);
      font-weight:950;
    }
    .actions a.secondary{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
    }

    /* Excavator lane (below buttons, NOT overlay) */
    .plantLane{
      margin-top:16px;
      height:82px;
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }

    .excavator{
      position:absolute;
      left:-60%;
      bottom:14px;
      display:inline-flex;
      align-items:flex-end;
      gap:10px;
      opacity:0;
      transform: translateY(0);
      will-change:left, transform, opacity;
    }

    .excavator.run{
      opacity:1;
      animation: excavatorRun 3.4s ease-in-out 0s 1 forwards;
    }

    /* Small “dig dip” mid-run */
    @keyframes excavatorRun{
      0%   { left:-60%; transform: translateY(0); }
      50%  { transform: translateY(0); }
      58%  { transform: translateY(4px); }
      65%  { transform: translateY(0); }
      100% { left:120%; transform: translateY(0); opacity:0; }
    }

    .trackline{
      width:220px;
      height:10px;
      border-radius:8px;
      opacity:0.18;
      background: repeating-linear-gradient(
        90deg,
        rgba(17,17,17,0.85) 0 14px,
        rgba(17,17,17,0.0) 14px 22px
      );
      transform: translateY(6px);
    }
    .excavator.run .trackline{
      animation: trackMove 280ms linear infinite;
    }
    @keyframes trackMove{
      from { background-position: 0 0; }
      to   { background-position: 22px 0; }
    }

    .excavator svg{
      width:160px;
      height:auto;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
    }

    /* Dust puff (dig moment) */
    .digDust{
      position:absolute;
      right:12px;
      bottom:38px;
      width:6px;
      height:6px;
      border-radius:50%;
      opacity:0;
      background:#92400e;
      box-shadow:
        -10px 8px 0 #b45309,
        -18px 2px 0 #92400e,
        -26px 10px 0 #b45309,
        -34px 5px 0 #92400e;
      transform: scale(0.6);
    }
    .excavator.run .digDust{
      animation: dustPuff 700ms ease-out 1;
      animation-delay: 1.85s;
    }
    @keyframes dustPuff{
      0%   { opacity:0; transform: translateY(0) scale(0.6); }
      20%  { opacity:0.9; }
      100% { opacity:0; transform: translateY(-18px) scale(1.25); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <!-- Confetti overlay -->
      <div id="celebrateLayer" aria-hidden="true">
        <div id="confettiLayer"></div>
      </div>

      <div class="tick">✓</div>
      <h1>Submitted</h1>
      <p class="sub">Nice one. The checklist has been sent and saved.</p>
      <div class="note">Safe shift. No paperwork drama.</div>

      <div class="meta" id="metaBox" style="display:none;"></div>

      <!-- Good job GIF -->
      <div class="art" role="img" aria-label="Good job">
        <img
          class="gifCard"
          src="/assets/good-job.gif"
          alt="Good job"
          width="420"
          height="240"
          loading="lazy"
          decoding="async"
        />
      </div>

      <div class="actions">
        <a class="secondary" id="newBtn" href="/selector.html">New check</a>
        <a id="backBtn" href="/index.html">Back to form</a>
      </div>

      <!-- Excavator lane (below buttons) -->
      <div class="plantLane" aria-hidden="true">
        <div id="excavator" class="excavator">
          <span class="trackline"></span>

          <!-- Option B excavator -->
          <svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="48" y="138" width="210" height="44" rx="22" fill="#111"/>
            <rect x="70" y="152" width="166" height="16" rx="8" fill="#2b2b2b" opacity="0.85"/>
            <g fill="#111" opacity="0.55">
              <circle cx="86" cy="160" r="6"/>
              <circle cx="116" cy="160" r="6"/>
              <circle cx="146" cy="160" r="6"/>
              <circle cx="176" cy="160" r="6"/>
              <circle cx="206" cy="160" r="6"/>
              <circle cx="236" cy="160" r="6"/>
            </g>

            <g stroke="#111" stroke-width="4" stroke-linejoin="round">
              <path d="M112 138 h138 q22 0 22-22 v-10 q0-22-22-22 h-122 q-22 0-22 22 v10 q0 22 28 22Z"
                    fill="#facc15"/>
              <path d="M178 106 v-34 q0-20 20-20 h50 q20 0 20 20 v66 h-90Z"
                    fill="#facc15"/>
              <path d="M196 76 h48 q10 0 10 10 v26 h-68 v-26 q0-10 10-10Z"
                    fill="#e5e7eb"/>
            </g>

            <path d="M270 116 C305 98, 332 86, 360 78"
                  stroke="#facc15" stroke-width="18" stroke-linecap="round" fill="none"/>
            <path d="M270 116 C305 98, 332 86, 360 78"
                  stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>

            <path d="M360 78 C380 78, 396 92, 406 112"
                  stroke="#facc15" stroke-width="16" stroke-linecap="round" fill="none"/>
            <path d="M360 78 C380 78, 396 92, 406 112"
                  stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>

            <path d="M404 112 l12 12 q8 8-2 16 q-22 16-52 6 q-14-5-7-18 l12-18Z"
                  fill="#facc15" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
          </svg>

          <span class="digDust"></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const type = (qs.get("type") || "").toLowerCase();
      const plantId = qs.get("plantId") || "";
      const date = qs.get("date") || "";
      const t = qs.get("t") || "";

      const niceType = type ? (type.charAt(0).toUpperCase() + type.slice(1)) : "";

      const meta = document.getElementById("metaBox");
      if (niceType || plantId || date) {
        meta.style.display = "inline-block";
        meta.innerHTML =
          '<div>Type: <span>' + escapeHtml(niceType) + '</span></div>' +
          '<div>Plant ID: <span>' + escapeHtml(plantId) + '</span></div>' +
          '<div>Date: <span>' + escapeHtml(date) + '</span></div>';
      }

      const newBtn = document.getElementById("newBtn");
      const backBtn = document.getElementById("backBtn");

      if (t) {
        newBtn.href = '/selector.html?t=' + encodeURIComponent(t);
        if (type) backBtn.href = '/index.html?t=' + encodeURIComponent(t) + '&type=' + encodeURIComponent(type);
        else backBtn.href = '/index.html?t=' + encodeURIComponent(t);
      }

      // Start animations after first paint (helps mobile webviews)
      setTimeout(runCelebration, 50);

      function runCelebration(){
        const confettiLayer = document.getElementById("confettiLayer");
        const card = document.querySelector(".card");
        if (confettiLayer && card) launchConfetti(confettiLayer, card);

        const ex = document.getElementById("excavator");
        if (ex) {
          ex.classList.remove("run");
          void ex.offsetWidth;
          ex.classList.add("run");
        }
      }

      function launchConfetti(layer, card){
        layer.innerHTML = "";

        const colors = [
          "#16a34a", "#22c55e", "#facc15", "#f59e0b",
          "#60a5fa", "#a78bfa", "#fb7185", "#111827"
        ];

        const pieceCount = 90;
        const endY = (card.clientHeight + 120);

        for (let i = 0; i < pieceCount; i++) {
          const p = document.createElement("div");
          p.className = "confetti-piece";

          const left = Math.random() * 100;
          const sizeW = 6 + Math.random() * 8;
          const sizeH = 10 + Math.random() * 12;
          const drift = (Math.random() * 140) - 70;
          const rot = (Math.random() * 720) + 180;
          const dur = 900 + Math.random() * 900;
          const delay = Math.random() * 180;

          p.style.left = left + "%";
          p.style.width = sizeW + "px";
          p.style.height = sizeH + "px";
          p.style.background = colors[Math.floor(Math.random() * colors.length)];

          p.style.setProperty("--drift", drift + "px");
          p.style.setProperty("--rot", rot + "deg");
          p.style.setProperty("--dur", dur + "ms");
          p.style.setProperty("--delay", delay + "ms");
          p.style.setProperty("--endY", endY + "px");

          layer.appendChild(p);
        }

        setTimeout(function(){ layer.innerHTML = ""; }, 2300);
      }

      function escapeHtml(s){
        return String(s)
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
      }
    })();
  </script>
</body>
</html>

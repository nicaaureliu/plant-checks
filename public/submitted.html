<!-- public/submitted.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Submitted</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --ok:#16a34a; --btn:#111; --btnText:#fff; --radius:16px;

      /* Smiley face */
      --face:#fde047;        /* yellow */
      --faceStroke:#f59e0b;  /* amber stroke */
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:var(--text); }
    .wrap{ max-width:640px; margin:24px auto 40px; padding:0 14px; }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 2px 14px rgba(0,0,0,.05);
      padding:18px;
      overflow:hidden;
      text-align:center;
      position:relative;
    }

    /* Keep celebration behind the content */
    #celebrateLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
      border-radius:var(--radius);
    }
    .card > :not(#celebrateLayer){
      position:relative;
      z-index:2;
    }

    /* Confetti container */
    #confettiLayer{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .confetti-piece{
      position:absolute;
      top:-14px;
      width:10px;
      height:14px;
      border-radius:2px;
      opacity:0.95;
      transform: translate3d(0,0,0) rotate(0deg);
      animation: confettiFall var(--dur, 1400ms) linear var(--delay, 0ms) forwards;
      will-change: transform, opacity;
    }

    @keyframes confettiFall{
      0%   { transform: translate3d(0,0,0) rotate(0deg); opacity:1; }
      100% { transform: translate3d(var(--drift, 0px), var(--endY, 520px), 0) rotate(var(--rot, 360deg)); opacity:0.95; }
    }

    /* Excavator drive-by */
    .excavator{
      position:absolute;
      left:-45%;
      bottom:18px;
      display:inline-flex;
      align-items:flex-end;
      gap:10px;
      opacity:0;
      transform: translateY(0);
      will-change: left, transform, opacity;
    }

    .excavator.run{
      opacity:1;
      animation: excavatorRun 3.0s ease-in-out 0s 1 forwards;
    }

    @keyframes excavatorRun{
      0%   { left:-45%; transform: translateY(0); }
      20%  { transform: translateY(-1px); }
      45%  { transform: translateY(0); }
      70%  { transform: translateY(-1px); }
      100% { left:120%; transform: translateY(0); opacity:0; }
    }

    .trackline{
      width:220px;
      height:10px;
      border-radius:8px;
      opacity:0.18; /* subtle, so it doesn't look cartoon */
      background: repeating-linear-gradient(
        90deg,
        rgba(17,17,17,0.85) 0 14px,
        rgba(17,17,17,0.0) 14px 22px
      );
      transform: translateY(6px);
    }

    .excavator.run .trackline{
      animation: trackMove 280ms linear infinite;
    }

    @keyframes trackMove{
      from { background-position: 0 0; }
      to   { background-position: 22px 0; }
    }

    .excavator svg{
      width:160px;
      height:auto;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .confetti-piece{ animation:none !important; opacity:0 !important; }
      .excavator, .excavator.run{ animation:none !important; opacity:0 !important; }
      .excavator.run .trackline{ animation:none !important; }
    }

    .tick{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:74px; height:74px;
      border-radius:999px;
      border:2px solid rgba(22,163,74,.25);
      background:rgba(22,163,74,.08);
      margin:6px auto 10px;
      font-size:42px;
      color:var(--ok);
      font-weight:900;
    }
    h1{ margin:0 0 6px; font-size:26px; font-weight:950; letter-spacing:-0.3px; }
    .sub{ color:var(--muted); font-weight:800; margin:0 0 14px; line-height:1.35; }
    .note{
      margin:0 0 14px;
      font-weight:900;
      color:#111;
    }

    .meta{
      margin:0 auto 14px;
      display:inline-block;
      text-align:left;
      border:1px dashed var(--line);
      border-radius:14px;
      padding:12px 14px;
      background:#fff;
      font-weight:800;
      max-width:100%;
    }
    .meta div{ margin:4px 0; color:var(--muted); font-weight:900; }
    .meta span{ color:#111; font-weight:950; }

    .art{
      margin:8px auto 18px;
      max-width:420px;
    }

    .actions{ display:flex; gap:12px; margin-top:10px; }
    .actions a{
      flex:1;
      text-decoration:none;
      display:inline-block;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.6);
      background:var(--btn);
      color:var(--btnText);
      font-weight:950;
    }
    .actions a.secondary{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <!-- Celebration overlay -->
      <div id="celebrateLayer" aria-hidden="true">
        <div id="confettiLayer"></div>

        <div id="excavator" class="excavator">
          <span class="trackline"></span>

          <!-- Option B: Safety-yellow but clean/pro -->
          <svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Tracks -->
            <rect x="48" y="138" width="210" height="44" rx="22" fill="#111"/>
            <rect x="70" y="152" width="166" height="16" rx="8" fill="#2b2b2b" opacity="0.85"/>
            <g fill="#111" opacity="0.55">
              <circle cx="86" cy="160" r="6"/>
              <circle cx="116" cy="160" r="6"/>
              <circle cx="146" cy="160" r="6"/>
              <circle cx="176" cy="160" r="6"/>
              <circle cx="206" cy="160" r="6"/>
              <circle cx="236" cy="160" r="6"/>
            </g>

            <!-- Upper body + cabin -->
            <g stroke="#111" stroke-width="4" stroke-linejoin="round">
              <path d="M112 138
                       h138
                       q22 0 22-22
                       v-10
                       q0-22-22-22
                       h-122
                       q-22 0-22 22
                       v10
                       q0 22 28 22Z"
                    fill="#facc15"/>
              <path d="M178 106
                       v-34
                       q0-20 20-20
                       h50
                       q20 0 20 20
                       v66
                       h-90Z"
                    fill="#facc15"/>
              <path d="M196 76
                       h48
                       q10 0 10 10
                       v26
                       h-68
                       v-26
                       q0-10 10-10Z"
                    fill="#e5e7eb"/>
            </g>

            <!-- Boom + dipper -->
            <path d="M270 116 C305 98, 332 86, 360 78"
                  stroke="#facc15" stroke-width="18" stroke-linecap="round" fill="none"/>
            <path d="M270 116 C305 98, 332 86, 360 78"
                  stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>

            <path d="M360 78 C380 78, 396 92, 406 112"
                  stroke="#facc15" stroke-width="16" stroke-linecap="round" fill="none"/>
            <path d="M360 78 C380 78, 396 92, 406 112"
                  stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>

            <!-- Bucket -->
            <path d="M404 112
                     l12 12
                     q8 8-2 16
                     q-22 16-52 6
                     q-14-5-7-18
                     l12-18Z"
                  fill="#facc15" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="tick">✓</div>
      <h1>Submitted</h1>
      <p class="sub">Nice one. The checklist has been sent and saved.</p>
      <div class="note">Safe shift. No paperwork drama.</div>

      <div class="meta" id="metaBox" style="display:none;"></div>

      <!-- Big smile (yellow) -->
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 520 280" width="100%" height="auto">
          <rect x="12" y="12" width="496" height="256" rx="22" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2"/>
          <circle cx="260" cy="140" r="92" style="fill: var(--face); stroke: var(--faceStroke);" stroke-width="2"/>
          <circle cx="225" cy="125" r="8.5" fill="#111"/>
          <circle cx="295" cy="125" r="8.5" fill="#111"/>
          <path d="M212 160 Q260 205 308 160" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="actions">
        <a class="secondary" id="newBtn" href="/selector.html">New check</a>
        <a id="backBtn" href="/index.html">Back to form</a>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const type = (qs.get("type") || "").toLowerCase();
      const plantId = qs.get("plantId") || "";
      const date = qs.get("date") || "";
      const t = qs.get("t") || "";

      const niceType = type ? (type.charAt(0).toUpperCase() + type.slice(1)) : "";

      const meta = document.getElementById("metaBox");
      if (niceType || plantId || date) {
        meta.style.display = "inline-block";
        meta.innerHTML = `
          <div>Type: <span>${escapeHtml(niceType)}</span></div>
          <div>Plant ID: <span>${escapeHtml(plantId)}</span></div>
          <div>Date: <span>${escapeHtml(date)}</span></div>
        `;
      }

      const newBtn = document.getElementById("newBtn");
      const backBtn = document.getElementById("backBtn");

      if (t) {
        newBtn.href = `/selector.html?t=${encodeURIComponent(t)}`;
        if (type) backBtn.href = `/index.html?t=${encodeURIComponent(t)}&type=${encodeURIComponent(type)}`;
        else backBtn.href = `/index.html?t=${encodeURIComponent(t)}`;
      }

      // Run celebration on load
      runCelebration();

      function runCelebration(){
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const confettiLayer = document.getElementById("confettiLayer");
        const card = document.querySelector(".card");
        if (confettiLayer && card) launchConfetti(confettiLayer, card);

        const ex = document.getElementById("excavator");
        if (ex) {
          ex.classList.remove("run");
          void ex.offsetWidth; // restart animation reliably
          ex.classList.add("run");
        }

        if (navigator.vibrate) navigator.vibrate(35);
      }

      function launchConfetti(layer, card){
        layer.innerHTML = "";

        const colors = [
          "#16a34a", "#22c55e", "#facc15", "#f59e0b",
          "#60a5fa", "#a78bfa", "#fb7185", "#111827"
        ];

        const pieceCount = 90;
        const endY = (card.clientHeight + 120);

        for (let i = 0; i < pieceCount; i++) {
          const p = document.createElement("div");
          p.className = "confetti-piece";

          const left = Math.random() * 100;
          const sizeW = 6 + Math.random() * 8;
          const sizeH = 10 + Math.random() * 12;
          const drift = (Math.random() * 140) - 70; // -70..+70px
          const rot = (Math.random() * 720) + 180;  // 180..900deg
          const dur = 900 + Math.random() * 900;    // 900..1800ms
          const delay = Math.random() * 180;        // 0..180ms

          p.style.left = left + "%";
          p.style.width = sizeW + "px";
          p.style.height = sizeH + "px";
          p.style.background = colors[Math.floor(Math.random() * colors.length)];

          p.style.setProperty("--drift", drift + "px");
          p.style.setProperty("--rot", rot + "deg");
          p.style.setProperty("--dur", dur + "ms");
          p.style.setProperty("--delay", delay + "ms");
          p.style.setProperty("--endY", endY + "px");

          layer.appendChild(p);
        }

        setTimeout(() => { layer.innerHTML = ""; }, 2300);
      }

      function escapeHtml(s){
        return String(s)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#39;");
      }
    })();
  </script>
</body>
</html>

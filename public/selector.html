<!-- public/selector.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Select Checklist Type</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#fff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --line2:#d1d5db;
      --yellow:#ffd600;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:920px;
      margin:22px auto 40px;
      padding:0 14px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(17,24,39,.06); /* softer, less “dirty” */
      padding:16px;
      overflow:hidden;
    }

    /* Header (logos row, then text below) */
    .header{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
      box-shadow:0 8px 22px rgba(17,24,39,.06); /* softer */
    }

    .logosRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .logoLeft{ width:82px; height:auto; }
    .logoRight{ width:58px; height:auto; }

    .headerText{
      text-align:center;
      padding-top:10px;
    }

    h1{
      margin:0;
      font-size:23px;
      font-weight:950;
      letter-spacing:-0.3px;
      line-height:1.15;
    }

    .hint{
      margin:10px auto 0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:var(--yellow);
      border:1px solid rgba(0,0,0,.18);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      font-size:14px;
      max-width:100%;
    }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .btn{
      width:100%;
      border-radius:18px;
      padding:18px 14px;
      cursor:pointer;

      /* KEY FIX: lighter border */
      border:1px solid var(--line2);
      background:#fff;
      color:var(--text);
      text-decoration:none;

      display:grid;
      gap:10px;
      text-align:center;

      /* KEY FIX: softer shadow */
      box-shadow:0 10px 22px rgba(17,24,39,.08);
      transition:transform .10s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    /* Hover/press: keep professional (don’t go full black) */
    @media (hover: hover) and (pointer: fine){
      .btn:hover{
        transform:translateY(-2px);
        border-color:#cbd5e1;
        box-shadow:0 16px 34px rgba(17,24,39,.12);
        background:#ffffff;
      }
    }

    @media (hover: none) and (pointer: coarse){
      .btn:active{
        transform:scale(0.99);
        border-color:#cbd5e1;
        box-shadow:0 12px 26px rgba(17,24,39,.12);
      }
    }

    .btn:focus-visible{
      outline:3px solid rgba(255,214,0,.95);
      outline-offset:4px;
    }

    .icon{
      display:flex;
      justify-content:center;
      align-items:center;
      height:64px;
    }

    .iconImg{
      width:64px;
      height:64px;
      object-fit:contain;
      display:block;
      image-rendering:auto;
      opacity:0.92; /* slightly softer than pure black */
    }

    .name{
      font-size:19px;
      font-weight:950;
      line-height:1.1;
    }

    .meta{
      font-size:11px;
      font-weight:900;
      color:rgba(17,24,39,.55);
      justify-self:center;
      letter-spacing:.1px;
    }

    .bad{
      color:#dc2626;
      font-weight:900;
      text-align:center;
      margin-top:12px;
    }

    @media (min-width: 620px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr 1fr; }
    }

    @media (max-width:760px){
      .logoLeft{ width:76px; }
      .logoRight{ width:52px; }
      h1{ font-size:20px; }
      .headerText{ padding-top:8px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="header">
        <div class="logosRow">
          <img class="logoLeft" src="/assets/atl-logo.png" alt="Active Tunnelling" />
          <img class="logoRight" src="/assets/tp.png" alt="TP" />
        </div>

        <div class="headerText">
          <h1>Plant Pre-Use Inspection Checklist</h1>
          <div class="hint">Choose plant type to start</div>
        </div>
      </div>

      <div class="grid">
        <a class="btn" id="linkExc" href="#" aria-label="Excavator checklist">
          <span class="icon" aria-hidden="true">
            <img class="iconImg" src="/assets/icon-excavator.png" alt="" />
          </span>
          <span class="name">Excavator</span>
          <span class="meta">Form: QPFPL5.2</span>
        </a>

        <a class="btn" id="linkCrane" href="#" aria-label="Crane checklist">
          <span class="icon" aria-hidden="true">
            <img class="iconImg" src="/assets/icon-crane.png" alt="" />
          </span>
          <span class="name">Crane</span>
          <span class="meta">Form: QPFPL5.0</span>
        </a>

        <a class="btn" id="linkDump" href="#" aria-label="Dumper checklist">
          <span class="icon" aria-hidden="true">
            <img class="iconImg" src="/assets/icon-dumper.png" alt="" />
          </span>
          <span class="name">Dumper</span>
          <span class="meta">Form: QPFPL5.1</span>
        </a>
      </div>

      <div id="err" class="bad" style="display:none;"></div>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const t = qs.get("t") || "";

      const err = document.getElementById("err");
      const showErr = (msg) => { err.textContent = msg; err.style.display = "block"; };

      if (!t) {
        showErr("Missing token in QR link (t=...). Please scan the correct QR code.");
        return;
      }

      const base = `/index.html?t=${encodeURIComponent(t)}&type=`;
      document.getElementById("linkExc").href   = base + "excavator";
      document.getElementById("linkCrane").href = base + "crane";
      document.getElementById("linkDump").href  = base + "dumper";
    })();
  </script>
</body>
</html>

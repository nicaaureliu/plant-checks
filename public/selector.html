<!-- public/selector.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Select Checklist Type</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#fff;
      --text:#111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:920px;
      margin:22px auto 40px;
      padding:0 14px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 2px 14px rgba(0,0,0,.05);
      padding:16px;
      overflow:hidden;
    }

    /* Header */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
      box-shadow:0 2px 14px rgba(0,0,0,.05);
    }

    .logoLeft{ width:82px; height:auto; }
    .logoRight{ width:58px; height:auto; }

    .headerText{
      flex:1;
      text-align:center;
      padding:0 8px;
      min-width:0;
    }

    h1{
      margin:0;
      font-size:23px;
      font-weight:950;
      letter-spacing:-0.3px;
      line-height:1.15;
    }

    .hint{
      margin:10px auto 0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:var(--yellow);
      border:1px solid rgba(0,0,0,.2);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      font-size:14px;
      max-width:100%;
    }

    /* Buttons grid */
    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .btn{
      width:100%;
      border-radius:18px;
      padding:18px 14px;
      cursor:pointer;

      border:1.5px solid rgba(17,17,17,.78);
      background:#fff;
      color:#111;
      text-decoration:none;

      display:grid;
      gap:10px;
      text-align:center;

      box-shadow:0 10px 22px rgba(0,0,0,.08);
      transition:transform .08s ease, box-shadow .14s ease, background .14s ease, color .14s ease, border-color .14s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    /* Desktop hover only */
    @media (hover: hover) and (pointer: fine){
      .btn:hover{
        background:#111;
        color:#fff;
        transform:translateY(-1px);
        border-color:#111;
        box-shadow:0 14px 28px rgba(0,0,0,.12);
      }
      .btn:hover .meta{
        color:rgba(255,255,255,.85);
      }
    }

    /* Phone/tablet press feedback */
    @media (hover: none) and (pointer: coarse){
      .btn:active{
        background:#111;
        color:#fff;
        border-color:#111;
        transform:scale(0.99);
        box-shadow:0 8px 18px rgba(0,0,0,.12);
      }
      .btn:active .meta{
        color:rgba(255,255,255,.85);
      }
    }

    .btn:focus-visible{
      outline:3px solid rgba(255,214,0,.95);
      outline-offset:4px;
    }

    .icon{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Slightly larger, more recognisable machine icons */
    .icon svg{
      width:54px;
      height:54px;
      display:block;
    }

    .name{
      font-size:19px;
      font-weight:950;
      line-height:1.1;
    }

    .meta{
      font-size:11px;
      font-weight:900;
      color:rgba(0,0,0,.55);
      justify-self:center;
      letter-spacing:.1px;
    }

    @media (hover: hover) and (pointer: fine){
      .btn:hover .meta{ color:rgba(255,255,255,.85); }
    }

    .bad{
      color:#dc2626;
      font-weight:900;
      text-align:center;
      margin-top:12px;
    }

    /* Breakpoints: avoid 3-across too early */
    @media (min-width: 620px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr 1fr; }
    }

    @media (max-width:760px){
      .logoLeft{ width:76px; }
      .logoRight{ width:52px; }
      h1{ font-size:20px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="header">
        <img class="logoLeft" src="/assets/atl-logo.png" alt="Active Tunnelling" />

        <div class="headerText">
          <h1>Plant Pre-Use Inspection Checklist</h1>
          <div class="hint">Choose plant type to start</div>
        </div>

        <img class="logoRight" src="/assets/tp.png" alt="TP" />
      </div>

      <div class="grid">
        <!-- EXCAVATOR -->
        <a class="btn" id="linkExc" href="#" data-type="excavator" aria-label="Excavator checklist">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <!-- tracks -->
              <rect x="10" y="45" width="34" height="9" rx="4.5" fill="currentColor"/>
              <circle cx="16" cy="54" r="2.8" fill="currentColor" opacity=".85"/>
              <circle cx="24" cy="54" r="2.8" fill="currentColor" opacity=".85"/>
              <circle cx="32" cy="54" r="2.8" fill="currentColor" opacity=".85"/>
              <circle cx="40" cy="54" r="2.8" fill="currentColor" opacity=".85"/>

              <!-- body + cab -->
              <rect x="18" y="31" width="18" height="12" rx="3" fill="currentColor"/>
              <rect x="22" y="34" width="7" height="6" rx="1.5" fill="#fff" opacity=".28"/>

              <!-- boom + stick -->
              <path d="M34 32 L46 23 L50 26 L40 36 Z" fill="currentColor"/>
              <path d="M40 36 L53 42 L51 46 L38 40 Z" fill="currentColor"/>

              <!-- bucket -->
              <path d="M52 45
                       c2.5-2.5 6-2.2 7.8 0.2
                       c1.2 1.6 0.6 4-1.2 5.2
                       c-2.6 1.8-6.7 1.2-9.2-0.8
                       z"
                    fill="currentColor"/>
            </svg>
          </span>
          <span class="name">Excavator</span>
          <span class="meta">Form: QPFPL5.2</span>
        </a>

        <!-- CRANE -->
        <a class="btn" id="linkCrane" href="#" data-type="crane" aria-label="Crane checklist">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <!-- tracks -->
              <rect x="9" y="46" width="36" height="8" rx="4" fill="currentColor"/>
              <circle cx="16" cy="54" r="2.6" fill="currentColor" opacity=".85"/>
              <circle cx="25" cy="54" r="2.6" fill="currentColor" opacity=".85"/>
              <circle cx="34" cy="54" r="2.6" fill="currentColor" opacity=".85"/>

              <!-- superstructure -->
              <rect x="20" y="30" width="12" height="16" rx="2.5" fill="currentColor"/>
              <rect x="22.5" y="33" width="7" height="6" rx="1.5" fill="#fff" opacity=".28"/>

              <!-- boom -->
              <path d="M26 30 L54 14 L56 18 L28 34 Z" fill="currentColor"/>

              <!-- hoist line + hook (stroke for clarity) -->
              <path d="M52 20 L52 36" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M52 36
                       c0 4 2 6 5 6
                       c1.5 0 2.5 1.2 2.5 2.6
                       c0 2.2-2.1 4.2-5.6 4.2
                       c-3.6 0-6-2.4-6-5.5"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
          <span class="name">Crane</span>
          <span class="meta">Form: QPFPL5.0</span>
        </a>

        <!-- DUMPER -->
        <a class="btn" id="linkDump" href="#" data-type="dumper" aria-label="Dumper checklist">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <!-- skip/body -->
              <path d="M20 26 H50 L44 38 H20 Z" fill="currentColor"/>
              <path d="M44 38 L50 26 L54 28 L47 40 Z" fill="currentColor" opacity=".92"/>

              <!-- chassis -->
              <rect x="14" y="38" width="38" height="8" rx="3" fill="currentColor"/>

              <!-- cab -->
              <path d="M14 32 H24 L28 38 H14 Z" fill="currentColor"/>
              <rect x="16" y="33.5" width="6.5" height="4.5" rx="1.2" fill="#fff" opacity=".28"/>

              <!-- wheels -->
              <circle cx="22" cy="49" r="4.2" fill="currentColor"/>
              <circle cx="44" cy="49" r="4.2" fill="currentColor"/>
              <circle cx="22" cy="49" r="2.1" fill="#fff" opacity=".25"/>
              <circle cx="44" cy="49" r="2.1" fill="#fff" opacity=".25"/>
            </svg>
          </span>
          <span class="name">Dumper</span>
          <span class="meta">Form: QPFPL5.1</span>
        </a>
      </div>

      <div id="err" class="bad" style="display:none;"></div>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const t = qs.get("t") || "";

      const err = document.getElementById("err");
      const showErr = (msg) => { err.textContent = msg; err.style.display = "block"; };

      if (!t) {
        showErr("Missing token in QR link (t=...). Please scan the correct QR code.");
        return;
      }

      // IMPORTANT: use /index.html explicitly (avoids blank root route)
      const base = `/index.html?t=${encodeURIComponent(t)}&type=`;
      document.getElementById("linkExc").href   = base + "excavator";
      document.getElementById("linkCrane").href = base + "crane";
      document.getElementById("linkDump").href  = base + "dumper";
    })();
  </script>
</body>
</html>

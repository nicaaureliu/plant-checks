<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Select Checklist Type</title>
  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --btn:#111;
      --btnText:#fff;
      --btnAlt:#f3f4f6;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:640px;
      margin:24px auto 40px;
      padding:0 14px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow: 0 2px 14px rgba(0,0,0,.05);
      padding:16px;
      overflow:hidden;
    }
    .logos{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .logoLeft{ width:120px; height:auto; }
    .logoRight{ width:62px; height:auto; }

    h1{
      margin:10px 0 6px;
      font-size:22px;
      font-weight:900;
      letter-spacing:-0.2px;
      text-align:center;
    }
    p{
      margin:0 0 14px;
      color:var(--muted);
      text-align:center;
      line-height:1.35;
      font-weight:700;
    }
    .hint{
      margin:0 0 16px;
      background:var(--yellow);
      border:1px solid rgba(0,0,0,.15);
      border-radius:14px;
      padding:12px 14px;
      text-align:center;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:8px;
    }

    /* IMPORTANT: use <a> links so navigation works even if JS is slow */
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--btnAlt);
      font-weight:900;
      font-size:18px;
      color:#111;
      text-decoration:none;
    }
    .btn:active{ transform: translateY(1px); }
    .pill{
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:13px;
      font-weight:900;
      color:#111;
      white-space:nowrap;
    }

    .bad{
      color:#dc2626;
      font-weight:900;
      text-align:center;
      margin-top:12px;
    }

    @media (min-width: 680px){
      .grid{ grid-template-columns:1fr 1fr 1fr; }
      .btn{ justify-content:center; flex-direction:column; }
      .pill{ margin-top:6px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="logos">
        <img class="logoLeft" src="/assets/atl-logo.png" alt="Active Tunnelling" />
        <img class="logoRight" src="/assets/tp.png" alt="TP" />
      </div>

      <h1>Choose checklist type</h1>
      <p>This prevents people submitting the wrong form.</p>
      <div class="hint">Select the correct plant type to continue</div>

      <div class="grid">
        <a class="btn" id="linkExc" href="#">
          Excavator <span class="pill">QPFPL5.2</span>
        </a>
        <a class="btn" id="linkCrane" href="#">
          Crane <span class="pill">QPFPL5.0</span>
        </a>
        <a class="btn" id="linkDump" href="#">
          Dumper <span class="pill">QPFPL5.1</span>
        </a>
      </div>

      <div id="err" class="bad" style="display:none;"></div>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const t = qs.get("t") || "";

      const err = document.getElementById("err");
      const showErr = (msg) => { err.textContent = msg; err.style.display = "block"; };

      if (!t) {
        showErr("Missing token in QR link (t=...). Please scan the correct QR code.");
        return;
      }

      // IMPORTANT: send to "/" instead of "/index.html" (Cloudflare Pages safest)
      const base = `/?t=${encodeURIComponent(t)}&type=`;

      document.getElementById("linkExc").href   = base + "excavator";
      document.getElementById("linkCrane").href = base + "crane";
      document.getElementById("linkDump").href  = base + "dumper";
    })();
  </script>
</body>
</html>
